<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Christmas Tree Decorator 🎄</title>
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- Tone.js for web audio chime sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" crossorigin="anonymous"></script>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #0b1d3a, #1b3b5f); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { margin: 5px 0 0 0; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        p { margin: 2px 0 10px 0; color: #a2d2ff; font-size: 0.95rem; }
        video { display: none; }
        .canvas-container {
            position: relative;
            display: inline-block;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 3px solid rgba(255, 255, 255, 0.2);
            background: #000;
            max-width: 95vw;
            max-height: 80vh;
        }
        canvas { 
            display: block; 
            border-radius: 14px; 
            width: 100%;
            height: auto;
        }
        
        .snowflake {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }

        .audio-prompt {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.4);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>✨ Virtual Christmas Tree Decorator 🎄</h1>
    <p>Pinch Thumb + Index finger to grab ornaments from the bottom tray & place them on the tree!</p>
    
    <div class="canvas-container">
        <video class="input_video"></video>
        <!-- Interactive 800x600 Workspace -->
        <canvas class="output_canvas" width="800" height="600"></canvas>
        <div class="audio-prompt">🔔 Sound FX Enabled</div>
    </div>

    <!-- Snow Particles -->
    <script>
        for (let i = 0; i < 60; i++) {
            let snow = document.createElement('div');
            snow.className = 'snowflake';
            snow.style.left = Math.random() * 100 + 'vw';
            snow.style.top = (Math.random() * -100) + 'px';
            let size = Math.random() * 4 + 2;
            snow.style.width = size + 'px';
            snow.style.height = size + 'px';
            snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
            snow.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(snow);
        }
    </script>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');

        // Web Audio Synthesizer for Chime Placement Sounds
        let synth = null;
        function initAudio() {
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.5, sustain: 0.1, release: 0.8 }
                }).toDestination();
                synth.volume.value = -6;
            }
        }

        function playPlacementChime() {
            try {
                if (window.Tone && Tone.context.state !== 'running') {
                    Tone.start();
                }
                initAudio();
                if (synth) {
                    // Sparkling arpeggio notes
                    const notes = ["C6", "E6", "G6", "C7"];
                    notes.forEach((note, index) => {
                        synth.triggerAttackRelease(note, "16n", Tone.now() + index * 0.06);
                    });
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function playPickupChime() {
            try {
                if (window.Tone && Tone.context.state !== 'running') {
                    Tone.start();
                }
                initAudio();
                if (synth) {
                    synth.triggerAttackRelease("E6", "16n");
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Bottom Tray Items definition
        const trayItems = [
            { id: 'star', type: 'star', color: '#ffd700', label: 'Star' },
            { id: 'red', type: 'ball', color: '#d90429', label: 'Red' },
            { id: 'gold', type: 'ball', color: '#ffb703', label: 'Gold' },
            { id: 'blue', type: 'ball', color: '#2196f3', label: 'Blue' },
            { id: 'purple', type: 'ball', color: '#9c27b0', label: 'Purple' },
            { id: 'green', type: 'ball', color: '#2ec4b6', label: 'Emerald' }
        ];

        let placedOrnaments = [];
        let activeDraggedOrnament = null;
        let activeTraySlotIndex = null;
        let isDragging = false;
        let lightAnimTime = 0;

        // Coordinates for String Lights wrapped on tree
        const lightPositions = [
            // Top tier
            {x: 400, y: 120}, {x: 375, y: 160}, {x: 425, y: 160}, {x: 350, y: 200}, {x: 450, y: 200},
            // Middle tier
            {x: 400, y: 240}, {x: 335, y: 270}, {x: 465, y: 270}, {x: 300, y: 310}, {x: 500, y: 310}, {x: 380, y: 330}, {x: 420, y: 330},
            // Bottom tier
            {x: 270, y: 380}, {x: 530, y: 380}, {x: 320, y: 420}, {x: 480, y: 420}, {x: 240, y: 460}, {x: 560, y: 460}, {x: 370, y: 480}, {x: 430, y: 480}
        ];
        const lightColors = ['#ffd700', '#ff0055', '#00f0ff', '#00ff66', '#ff00ff', '#ffffff'];

        function drawChristmasTree(ctx, w, h) {
            // Trunk
            ctx.fillStyle = '#5c3d2e';
            ctx.fillRect(w / 2 - 20, h - 140, 40, 50);

            // Layer 3 (Bottom)
            ctx.fillStyle = '#1b4d3e';
            ctx.beginPath();
            ctx.moveTo(w / 2, h - 340);
            ctx.lineTo(w / 2 - 160, h - 120);
            ctx.lineTo(w / 2 + 160, h - 120);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#2d6a4f';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Layer 2 (Middle)
            ctx.beginPath();
            ctx.moveTo(w / 2, h - 450);
            ctx.lineTo(w / 2 - 120, h - 250);
            ctx.lineTo(w / 2 + 120, h - 250);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Layer 1 (Top)
            ctx.beginPath();
            ctx.moveTo(w / 2, h - 530);
            ctx.lineTo(w / 2 - 80, h - 370);
            ctx.lineTo(w / 2 + 80, h - 370);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function drawChristmasLights(ctx) {
            lightAnimTime += 0.05;

            // Connecting wire string
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < lightPositions.length - 1; i++) {
                if (i === 4 || i === 11) continue; 
                ctx.moveTo(lightPositions[i].x, lightPositions[i].y);
                ctx.lineTo(lightPositions[i + 1].x, lightPositions[i + 1].y);
            }
            ctx.stroke();

            // Glowing light bulbs
            lightPositions.forEach((pos, idx) => {
                let color = lightColors[idx % lightColors.length];
                let brightness = (Math.sin(lightAnimTime * 3 + idx) + 1) / 2;

                ctx.save();
                ctx.globalAlpha = brightness;
                ctx.shadowColor = color;
                ctx.shadowBlur = 12 * brightness;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 5, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.save();
            ctx.shadowColor = '#ffea00';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function drawOrnament(ctx, x, y, type, color, radius = 22) {
            if (type === 'star') {
                drawStar(ctx, x, y, 5, radius * 1.15, radius * 0.55, color);
                return;
            }

            ctx.save();
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Gold ornament top cap
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(x - 6, y - radius - 6, 12, 7);

            // Reflection shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(x - radius/3, y - radius/3, radius/4, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        function drawGestureTray(ctx, w, h) {
            const trayY = h - 65;
            const itemWidth = 95;
            const startX = (w - (trayItems.length * itemWidth)) / 2;

            // Tray Container Box
            ctx.fillStyle = 'rgba(10, 25, 47, 0.85)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(startX - 20, trayY - 30, trayItems.length * itemWidth + 40, 80, 18);
            ctx.fill();
            ctx.stroke();

            // Tray Items Rendering
            trayItems.forEach((item, index) => {
                const itemX = startX + index * itemWidth + itemWidth / 2;
                const itemY = trayY + 8;

                drawOrnament(ctx, itemX, itemY, item.type, item.color, 18);

                ctx.fillStyle = '#e0e1dd';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(item.label, itemX, itemY + 36);
            });

            return { startX, trayY, itemWidth };
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Privacy Blur on Webcam Video Frame
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.filter = 'blur(16px) brightness(0.4)';
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.filter = 'none'; 
            canvasCtx.restore();

            // Render Tree & Twinkling String Lights
            drawChristmasTree(canvasCtx, canvasElement.width, canvasElement.height);
            drawChristmasLights(canvasCtx);

            // Render Tray
            const trayInfo = drawGestureTray(canvasCtx, canvasElement.width, canvasElement.height);

            // Render All Placed Ornaments
            placedOrnaments.forEach(ornament => {
                drawOrnament(canvasCtx, ornament.x, ornament.y, ornament.type, ornament.color, 20);
            });

            // Hand Gesture Pinch Tracking Logic
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                const ix = (1 - landmarks[8].x) * canvasElement.width;
                const iy = landmarks[8].y * canvasElement.height;
                const tx = (1 - landmarks[4].x) * canvasElement.width;
                const ty = landmarks[4].y * canvasElement.height;

                const pinchDist = Math.hypot(ix - tx, iy - ty);

                // Pinch-to-Grab Interaction Detection
                if (pinchDist < 45 && !isDragging) {
                    // Check tray item pickup
                    trayItems.forEach((item, index) => {
                        const slotX = trayInfo.startX + index * trayInfo.itemWidth + trayInfo.itemWidth / 2;
                        const slotY = trayInfo.trayY + 8;
                        if (Math.hypot(ix - slotX, iy - slotY) < 40) {
                            isDragging = true;
                            activeTraySlotIndex = index;
                            activeDraggedOrnament = { x: ix, y: iy, type: item.type, color: item.color };
                            playPickupChime();
                        }
                    });

                    // Check existing placed ornament pickup
                    if (!isDragging) {
                        for (let i = placedOrnaments.length - 1; i >= 0; i--) {
                            if (Math.hypot(ix - placedOrnaments[i].x, iy - placedOrnaments[i].y) < 35) {
                                isDragging = true;
                                activeDraggedOrnament = placedOrnaments.splice(i, 1)[0];
                                playPickupChime();
                                break;
                            }
                        }
                    }
                }

                if (isDragging && activeDraggedOrnament) {
                    activeDraggedOrnament.x = ix;
                    activeDraggedOrnament.y = iy;
                }

                if (pinchDist >= 55 && isDragging) {
                    if (activeDraggedOrnament) {
                        if (activeDraggedOrnament.y < canvasElement.height - 90) {
                            placedOrnaments.push(activeDraggedOrnament);
                            playPlacementChime();
                        }
                        activeDraggedOrnament = null;
                    }
                    isDragging = false;
                }

                // Render Currently Dragged Ornament
                if (activeDraggedOrnament) {
                    drawOrnament(canvasCtx, activeDraggedOrnament.x, activeDraggedOrnament.y, activeDraggedOrnament.type, activeDraggedOrnament.color, 22);
                }

                // Render Cursor Indicator Point
                canvasCtx.fillStyle = isDragging ? '#ff0055' : '#00ffff';
                canvasCtx.beginPath();
                canvasCtx.arc(ix, iy, 8, 0, 2 * Math.PI);
                canvasCtx.fill();
            }
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        // Start Webcam Feed
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 800,
            height: 600
        });
        camera.start();

        // Audio Activation Listener on User Click
        window.addEventListener('click', () => {
            initAudio();
        }, { once: true });
    </script>
</body>
</html>
