<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Christmas Tree & Fog Window 🎄✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax5/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #0b1d3a, #1b3b5f); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        video { display: none; }
        canvas { 
            display: block; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .snowflake {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 10;
        }
        @keyframes fall {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>

    <!-- Snow Particles -->
    <script>
        for (let i = 0; i < 70; i++) {
            let snow = document.createElement('div');
            snow.className = 'snowflake';
            snow.style.left = Math.random() * 100 + 'vw';
            snow.style.top = (Math.random() * -100) + 'px';
            let size = Math.random() * 4 + 2;
            snow.style.width = size + 'px';
            snow.style.height = size + 'px';
            snow.style.animationDuration = (Math.random() * 4 + 2) + 's';
            snow.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(snow);
        }
    </script>

    <video class="input_video"></video>
    <canvas class="output_canvas"></canvas>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');

        // Resize canvas to full screen automatically
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Offscreen canvas for Fog Mirror drawing persistence
        const fogCanvas = document.createElement('canvas');
        const fogCtx = fogCanvas.getContext('2d');
        function initFogCanvas() {
            fogCanvas.width = window.innerWidth;
            fogCanvas.height = window.innerHeight;
            fogCtx.fillStyle = 'rgba(230, 240, 255, 0.88)';
            fogCtx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);
            
            // Add foggy texture title on the right
            fogCtx.fillStyle = 'rgba(100, 120, 150, 0.4)';
            fogCtx.font = 'bold 24px sans-serif';
            fogCtx.textAlign = 'center';
            fogCtx.fillText("❄️ Pinch & Draw on Foggy Window ❄️", fogCanvas.width * 0.75, 80);
        }
        initFogCanvas();

        // Tray Items
        const trayItems = [
            { id: 'star', type: 'star', color: '#ffd700', label: 'Star' },
            { id: 'red', type: 'ball', color: '#d90429', label: 'Red' },
            { id: 'gold', type: 'ball', color: '#ffb703', label: 'Gold' },
            { id: 'blue', type: 'ball', color: '#2196f3', label: 'Blue' },
            { id: 'purple', type: 'ball', color: '#9c27b0', label: 'Purple' },
            { id: 'green', type: 'ball', color: '#2ec4b6', label: 'Emerald' }
        ];

        let placedOrnaments = [];
        let activeDraggedOrnament = null;
        let isDragging = false;
        let lightAnimTime = 0;

        // Audio synth chime using Tone.js
        const synth = new Tone.Synth().toDestination();
        function playChime() {
            try {
                synth.triggerAttackRelease("C6", "8n");
            } catch(e) {}
        }

        const lightPositions = [];
        function generateLights() {
            lightPositions.length = 0;
            const cx = window.innerWidth * 0.3;
            const h = window.innerHeight;
            
            // Generate light coordinates around left side tree
            for (let i = 0; i < 24; i++) {
                lightPositions.push({
                    x: cx + (Math.random() * 200 - 100),
                    y: h * 0.2 + Math.random() * (h * 0.5)
                });
            }
        }
        generateLights();
        const lightColors = ['#ffd700', '#ff0055', '#00f0ff', '#00ff66', '#ff00ff', '#ffffff'];

        function drawChristmasTree(ctx, w, h) {
            const cx = w * 0.3;
            
            // Trunk
            ctx.fillStyle = '#5c3d2e';
            ctx.fillRect(cx - 20, h - 180, 40, 50);

            // Layer 3 (Bottom)
            ctx.fillStyle = '#1b4d3e';
            ctx.beginPath();
            ctx.moveTo(cx, h - 380);
            ctx.lineTo(cx - 170, h - 150);
            ctx.lineTo(cx + 170, h - 150);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#2d6a4f';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Layer 2 (Middle)
            ctx.beginPath();
            ctx.moveTo(cx, h - 490);
            ctx.lineTo(cx - 130, h - 280);
            ctx.lineTo(cx + 130, h - 280);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Layer 1 (Top)
            ctx.beginPath();
            ctx.moveTo(cx, h - 580);
            ctx.lineTo(cx - 90, h - 410);
            ctx.lineTo(cx + 90, h - 410);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function drawChristmasLights(ctx) {
            lightAnimTime += 0.05;
            lightPositions.forEach((pos, idx) => {
                let color = lightColors[idx % lightColors.length];
                let brightness = (Math.sin(lightAnimTime * 3 + idx) + 1) / 2;

                ctx.save();
                ctx.globalAlpha = brightness;
                ctx.shadowColor = color;
                ctx.shadowBlur = 14 * brightness;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 6, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.save();
            ctx.shadowColor = '#ffea00';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function drawOrnament(ctx, x, y, type, color, radius = 22) {
            if (type === 'star') {
                drawStar(ctx, x, y, 5, radius * 1.15, radius * 0.55, color);
                return;
            }

            ctx.save();
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffd700';
            ctx.fillRect(x - 6, y - radius - 6, 12, 7);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(x - radius/3, y - radius/3, radius/4, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        function drawGestureTray(ctx, w, h) {
            const cx = w * 0.3;
            const trayY = h - 75;
            const itemWidth = 85;
            const startX = cx - (trayItems.length * itemWidth) / 2;

            ctx.fillStyle = 'rgba(10, 25, 47, 0.85)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(startX - 15, trayY - 25, trayItems.length * itemWidth + 30, 75, 16);
            ctx.fill();
            ctx.stroke();

            trayItems.forEach((item, index) => {
                const itemX = startX + index * itemWidth + itemWidth / 2;
                const itemY = trayY + 10;
                drawOrnament(ctx, itemX, itemY, item.type, item.color, 16);

                ctx.fillStyle = '#e0e1dd';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(item.label, itemX, itemY + 34);
            });

            return { startX, trayY, itemWidth };
        }

        function drawClearButton(ctx, w) {
            const bx = w * 0.75;
            const by = 40;
            ctx.fillStyle = 'rgba(217, 4, 41, 0.85)';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(bx - 70, by - 20, 140, 40, 10);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Clear Window 🧽", bx, by + 5);
            return { x: bx, y: by, w: 140, h: 40 };
        }

        function onResults(results) {
            const w = canvasElement.width;
            const h = canvasElement.height;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);

            // Privacy blur on webcam background
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-w, 0);
            canvasCtx.filter = 'blur(16px) brightness(0.35)';
            canvasCtx.drawImage(results.image, 0, 0, w, h);
            canvasCtx.filter = 'none';
            canvasCtx.restore();

            // Left Side: Christmas Tree & Lights
            drawChristmasTree(canvasCtx, w, h);
            drawChristmasLights(canvasCtx);
            const trayInfo = drawGestureTray(canvasCtx, w, h);

            placedOrnaments.forEach(ornament => {
                drawOrnament(canvasCtx, ornament.x, ornament.y, ornament.type, ornament.color, 20);
            });

            // Right Side: Fog Mirror Drawing Canvas Overlay
            canvasCtx.drawImage(fogCanvas, 0, 0);
            const clearBtn = drawClearButton(canvasCtx, w);

            // Hand Tracking Interaction
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                const ix = (1 - landmarks[8].x) * w;
                const iy = landmarks[8].y * h;
                const tx = (1 - landmarks[4].x) * w;
                const ty = landmarks[4].y * h;

                const pinchDist = Math.hypot(ix - tx, iy - ty);

                // Right Side Fog Drawing Interaction
                if (ix > w * 0.5) {
                    // Check Clear Button
                    if (Math.abs(ix - clearBtn.x) < clearBtn.w/2 && Math.abs(iy - clearBtn.y) < clearBtn.h/2) {
                        if (pinchDist < 45) {
                            initFogCanvas();
                        }
                    } else if (pinchDist < 45) {
                        // Wipe / Draw on fog mirror with glowing sparkles
                        fogCtx.save();
                        fogCtx.globalCompositeOperation = 'destination-out';
                        fogCtx.beginPath();
                        fogCtx.arc(ix, iy, 30, 0, Math.PI * 2);
                        fogCtx.fill();
                        fogCtx.restore();

                        // Add glowing trail particle
                        fogCtx.fillStyle = '#00ffff';
                        fogCtx.shadowColor = '#00ffff';
                        fogCtx.shadowBlur = 10;
                        fogCtx.beginPath();
                        fogCtx.arc(ix, iy, 6, 0, Math.PI * 2);
                        fogCtx.fill();
                    }
                } else {
                    // Left Side Tree Interaction
                    if (pinchDist < 45 && !isDragging) {
                        trayItems.forEach((item, index) => {
                            const slotX = trayInfo.startX + index * trayInfo.itemWidth + trayInfo.itemWidth / 2;
                            const slotY = trayInfo.trayY + 10;
                            if (Math.hypot(ix - slotX, iy - slotY) < 40) {
                                isDragging = true;
                                activeDraggedOrnament = { x: ix, y: iy, type: item.type, color: item.color };
                            }
                        });

                        if (!isDragging) {
                            for (let i = placedOrnaments.length - 1; i >= 0; i--) {
                                if (Math.hypot(ix - placedOrnaments[i].x, iy - placedOrnaments[i].y) < 35) {
                                    isDragging = true;
                                    activeDraggedOrnament = placedOrnaments.splice(i, 1)[0];
                                    break;
                                }
                            }
                        }
                    }

                    if (isDragging && activeDraggedOrnament) {
                        activeDraggedOrnament.x = ix;
                        activeDraggedOrnament.y = iy;
                    }

                    if (pinchDist >= 55 && isDragging) {
                        if (activeDraggedOrnament) {
                            if (activeDraggedOrnament.y < h - 90 && activeDraggedOrnament.x < w * 0.5) {
                                placedOrnaments.push(activeDraggedOrnament);
                                playChime();
                            }
                            activeDraggedOrnament = null;
                        }
                        isDragging = false;
                    }
                }

                if (activeDraggedOrnament) {
                    drawOrnament(canvasCtx, activeDraggedOrnament.x, activeDraggedOrnament.y, activeDraggedOrnament.type, activeDraggedOrnament.color, 22);
                }

                // Cursor Indicator
                canvasCtx.fillStyle = isDragging ? '#ff0055' : '#00ffff';
                canvasCtx.beginPath();
                canvasCtx.arc(ix, iy, 8, 0, 2 * Math.PI);
                canvasCtx.fill();
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
