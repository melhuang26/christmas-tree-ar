<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Christmas Tree Decorator 🎄</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #0b1d3a, #1b3b5f); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            overflow: hidden;
            height: 100vh;
        }
        h1 { margin-top: 15px; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        p { margin: 5px 0 15px 0; color: #a2d2ff; font-size: 0.95rem; }
        video { display: none; }
        .canvas-container {
            position: relative;
            display: inline-block;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 3px solid rgba(255, 255, 255, 0.2);
            background: #000;
        }
        canvas { display: block; border-radius: 14px; }
        /* Snowflakes falling in CSS background */
        .snowflake {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>

    <h1>✨ Virtual Christmas Tree Decorator 🎄</h1>
    <p>Pinch your thumb and index finger near the red ornament to drag it onto the glowing tree!</p>
    
    <div class="canvas-container">
        <video class="input_video"></video>
        <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <!-- Generate CSS Snowflakes -->
    <script>
        for (let i = 0; i < 50; i++) {
            let snow = document.createElement('div');
            snow.className = 'snowflake';
            snow.style.left = Math.random() * 100 + 'vw';
            snow.style.top = (Math.random() * -100) + 'px';
            let size = Math.random() * 4 + 2;
            snow.style.width = size + 'px';
            snow.style.height = size + 'px';
            snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
            snow.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(snow);
        }
    </script>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');

        let ornamentPos = { x: 320, y: 240 };
        let isDragging = false;

        function drawChristmasTree(ctx, w, h) {
            // Draw a layered, glowing Christmas tree
            // Tree trunk
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(w / 2 - 15, h - 140, 30, 40);

            // Layer 3 (Bottom)
            ctx.fillStyle = '#1b4d3e';
            ctx.beginPath();
            ctx.moveTo(w / 2, h - 260);
            ctx.lineTo(w / 2 - 120, h - 100);
            ctx.lineTo(w / 2 + 120, h - 100);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#2d6a4f';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Layer 2 (Middle)
            ctx.beginPath();
            ctx.moveTo(w / 2, h - 350);
            ctx.lineTo(w / 2 - 90, h - 200);
            ctx.lineTo(w / 2 + 90, h - 200);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Layer 1 (Top)
            ctx.beginPath();
            ctx.moveTo(w / 2, h - 420);
            ctx.lineTo(w / 2 - 60, h - 300);
            ctx.lineTo(w / 2 + 60, h - 300);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Glowing Golden Star on Top
            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = '#ffea00';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            let starX = w / 2, starY = h - 440;
            ctx.arc(starX, starY, 12, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw webcam feed flipped in mirror view
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.restore();

            // Render the glowing Christmas Tree overlay
            drawChristmasTree(canvasCtx, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const ix = (1 - landmarks[8].x) * canvasElement.width;
                const iy = landmarks[8].y * canvasElement.height;
                const tx = (1 - landmarks[4].x) * canvasElement.width;
                const ty = landmarks
